<!doctype html>
<html lang="en">
  <body style="margin:0;padding:0;background:#fdf6ee;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#3b2a1a;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#fdf6ee;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border:1px solid #eadfd2;border-radius:20px;overflow:hidden;">
            <tr>
              <td style="padding:28px 28px 8px;text-align:center;">
                <div style="font-size:28px;line-height:1;margin-bottom:10px;">🐾</div>
                <h1 style="margin:0;font-family:Georgia,serif;font-size:26px;color:#7c5c3e;">Loggi</h1>
                <p style="margin:6px 0 0;font-size:13px;color:#6f5946;">Keep your pack happy and healthy</p>
              </td>
            </tr>
            <tr>
              <td style="padding:20px 28px 8px;">
                <h2 style="margin:0 0 12px;font-family:Georgia,serif;font-size:21px;color:#7c5c3e;">Confirm your new email</h2>
                <p style="margin:0 0 16px;font-size:15px;line-height:1.55;color:#3b2a1a;">
                  Confirm this address to finish changing the email on your Loggi account.
                </p>
                <p style="margin:0 0 22px;">
                  <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#7c5c3e;color:#ffffff;text-decoration:none;font-size:15px;font-weight:600;padding:12px 22px;border-radius:12px;">
                    Confirm new email
                  </a>
                </p>
                <p style="margin:0 0 18px;font-size:12px;line-height:1.5;color:#6f5946;">
                  If you did not ask to change your email, ignore this message and contact us through the support form in the app.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
